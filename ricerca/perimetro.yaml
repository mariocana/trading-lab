# Il perimetro del desk di ricerca (docs/desk_ricerca.md).
#
# Lo leggono gli agenti, per sapere cosa cercare e cosa scartare, e il codice, che rifiuta
# quello che sta fuori: `ricerca idea` non registra un'idea su un orizzonte spento o su un
# mercato senza dati o per una destinazione sconosciuta, `ricerca measure` non va oltre il tetto mensile.
#
# Si cambia con un commit. Un perimetro cambiato vale per le idee nuove: quelle gia nel
# registro restano giudicate con il perimetro del loro giorno.

orizzonti:
  intraday:
    attivo: true
    cosa: "entra ed esce nella stessa sessione"
    flat_a_fine_giornata: true
    misura: motore                  # multicharts/motore, barre da 1 minuto
  daily:
    attivo: false
    cosa: "decide una volta al giorno, tiene da uno a pochi giorni, anche overnight"
    flat_a_fine_giornata: false
    misura: null                    # non c'e ancora: servono barre giornaliere e un motore che le legga
  swing:
    attivo: false
    cosa: "tiene da giorni a settimane"
    flat_a_fine_giornata: false
    misura: null

# dati: true = lo storico a 1 minuto e in quantlake/data/multicharts e il motore lo legge.
mercati:
  NQ: {dati: true}
  ES: {dati: true}
  GC: {dati: false}
  CL: {dati: false}
  BTC: {dati: false}

# Per cosa si cerca l'idea. Si sceglie alla nascita (`ricerca idea --destination`) e decide con
# quali minimi viene letta la misura. Il resto del perimetro (orizzonti, mercati, tetto mensile)
# e uguale per tutte. Il perche della differenza e in multicharts/docs/prop_vs_live.md.
destinazioni:
  prop:
    cosa: "una eval o un conto funded: conta passare, con piu tentativi"
    errori_standard_min: 2.229              # eccesso / errore standard; era 3.0, abbassato da Mario il 18/11/2026 al t OOS citato dal corso (Live 002)
    dollari_al_giorno_per_micro_min: 10.0   # multicharts/docs/cosa_uccide_le_strategie.md: sotto non si parte
  live:
    cosa: "soldi propri, anche in demo: conta che l'edge regga nel tempo"
    errori_standard_min: 3.0
    dollari_al_giorno_per_micro_min: null   # nessun minimo al giorno: non c'e una eval da passare in tempo
    media_per_trade_per_micro_da_guardare: 7.0   # stampata accanto alla misura, non uccide (prop_vs_live.md: avg trade >= $70 a contratto)

misura:
  periodo: ["2020-01-01", "2024-12-31"]     # solo in-sample: il comando della misura non ne accetta altri
  idee_al_mese_max: 8                       # idee nuove che arrivano alla misura in un mese, dalle due porte insieme
